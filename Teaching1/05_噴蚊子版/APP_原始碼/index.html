<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起噴蚊子｜乒乓球</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#293f37;font-family:"Microsoft JhengHei",sans-serif}main{max-width:1120px;margin:32px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}small{font-size:16px;letter-spacing:2px;color:#65776c}h1{font-size:38px;margin:10px 0}p{line-height:1.7}header p{margin:0 0 22px;font-size:19px}.tag{padding:12px 18px;border:1px solid #b8c7b9;border-radius:30px;white-space:nowrap}.layout{display:grid;grid-template-columns:1fr 290px;gap:24px}.board{background:#fffdf7;border:2px solid #516f60;border-radius:24px 20px 26px 18px;padding:16px;box-shadow:5px 6px 0 #e1ddce}.stats{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px;font-size:20px}.stats strong{font-size:34px;color:#a34632}canvas{width:100%;display:block;background:#dce7db;border-radius:14px;touch-action:none;outline-offset:4px}.status{min-height:56px;margin:14px 0 0;font-size:20px;font-weight:bold;text-align:center}aside{background:#fffdf8;border:1px solid #d8d5c6;border-radius:20px;padding:24px}h2{font-size:23px;margin:0 0 18px}button,select{font:inherit;font-size:20px;min-height:52px;border-radius:12px;border:1px solid #718b7a;padding:12px 16px;cursor:pointer}button{background:#fffdf8;color:#294337}button:hover{background:#e6eddf}button:disabled{opacity:.45;cursor:default}.primary{background:#396550;color:white;border:0}.primary:hover{background:#294f3c}.controls{display:grid;gap:12px;margin:24px 0}select{width:100%;background:white;color:#294337;margin-top:8px}.help{font-size:18px}.help p{margin:12px 0}.keys{display:flex;gap:14px;margin-top:12px}.keys button{flex:1;touch-action:none;font-size:24px}footer{font-size:15px;line-height:1.8;color:#687367;margin:24px 0}details{margin-top:16px}summary{cursor:pointer}dialog{border:2px solid #6a806a;border-radius:24px;max-width:440px;width:90%;padding:32px;background:#fffdf5;color:#293f37}dialog::backdrop{background:#203b3380}dialog h2{font-size:30px}dialog p{font-size:22px}.dialogBtns{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:760px){main{margin:18px auto;padding:0 14px}.layout{grid-template-columns:1fr}header .tag{display:none}h1{font-size:30px}aside{padding:18px}.controls{grid-template-columns:1fr 1fr;margin:14px 0}.help{font-size:17px}}
main{max-width:1320px}.layout{grid-template-columns:minmax(0,1fr) 270px}canvas{aspect-ratio:800/420} @media(max-width:760px){.layout{grid-template-columns:1fr}} </style></head><body><main>
<header><div><small>動動腦 · 手眼互動</small><h1>一起噴蚊子</h1><p>移動噴霧罐，讓噴霧碰到蚊子。</p></div><span class="tag">噴蚊子 · 大泡泡版</span></header>
<div class="layout"><section class="board" aria-label="噴蚊子遊戲"><div class="stats"><span>得分 <strong id="score">0</strong></span><span>噴中 <strong id="hits">0</strong> 次</span></div><canvas id="court" width="800" height="420" tabindex="0" aria-label="遊戲區，使用方向鍵或拖曳移動噴霧罐"></canvas><p class="status" id="status" role="status">準備好了嗎？按「開始噴蚊子」或點蚊子。</p><div class="keys"><button id="left" aria-label="向左移動">← 向左</button><button id="right" aria-label="向右移動">向右 →</button></div></section>
<aside><h2>照自己的步調玩</h2><label for="speed">蚊子的速度</label><select id="speed"><option value="160">慢慢來</option><option value="240">一般速度</option><option value="300">挑戰一下</option></select><div class="controls"><button class="primary" id="start">開始噴蚊子</button><button id="pause" disabled>暫停一下</button><button id="end" disabled>結束本回合</button></div><div class="help"><p>① 按開始，蚊子出現，噴霧自動開啟。</p><p>② 電腦：移動滑鼠即可控制。平板：手指拖曳。也可用方向鍵。</p><p>③ 噴中一次加 <b>5分</b>。蚊子上下來回飛。想休息時，按暫停或結束。</p></div></aside></div>
<footer>以 A7_Pingpong_T2.aia 網頁版延伸。遊戲開始後自動噴霧，噴中一隻加5分；下一隻由上方出現。蚊子上下來回飛；按「結束本回合」查看成果。泡泡僅為視覺效果，不參與計分。本版不需登入、不上傳資料。</footer>
</main><dialog id="result" aria-labelledby="resultTitle"><h2 id="resultTitle">這一回合完成了</h2><p id="resultText"></p><p>休息一下，或再試一次。</p><div class="dialogBtns"><button class="primary" id="again">再玩一次</button><button id="closeResult">回到遊戲</button></div></dialog>
<script>
const canvas=document.querySelector('#court'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const game={mode:'ready',x:320,y:220,vx:0,vy:0,paddle:270,py:235,contact:false,score:0,hits:0};
const W=800,H=420,R=22,PW=100,PY=360,PH=170;let previous=0,held=0,dragging=false;
function move(x,y){game.paddle=Math.max(0,Math.min(W-PW,x-PW/2));if(y!==undefined)game.py=Math.max(0,Math.min(H-PH,y-PH/2));}
function updateLabels(){ $('score').textContent=game.score;$('hits').textContent=game.hits; }
function start(){if($('result').open)$('result').close();Object.assign(game,{mode:'running',x:320,y:30,score:0,hits:0,paddle:270,py:235,contact:false});const a=(55+Math.random()*70)*Math.PI/180,s=Number($('speed').value);game.vx=0;game.vy=s;updateLabels();$('status').textContent='移動噴霧罐，讓上方噴霧碰到蚊子。';$('pause').disabled=false;$('end').disabled=false;$('pause').textContent='暫停一下';$('start').textContent='重新開始';}
function pause(){if(!['running','paused'].includes(game.mode))return;game.mode=game.mode==='running'?'paused':'running';$('pause').textContent=game.mode==='paused'?'繼續噴蚊子':'暫停一下';$('status').textContent=game.mode==='paused'?'已暫停，準備好再繼續。':'移動噴霧罐，讓上方噴霧碰到蚊子。';held=0;}
function finish(){if(!['running','paused'].includes(game.mode))return;game.mode='ended';game.x=320;game.y=30;game.vx=game.vy=0;held=0;$('pause').disabled=true;$('end').disabled=true;$('status').textContent='本回合結束。按「重新開始」再試一次。';$('resultText').textContent=`你噴中了 ${game.hits} 次，共 ${game.score} 分。`;$('result').showModal();}
function step(dt){if(game.mode!=='running')return;if(held)move(game.paddle+PW/2+held*650*dt);const oldY=game.y;game.x+=game.vx*dt;game.y+=game.vy*dt;if(game.x<R){game.x=R;game.vx=Math.abs(game.vx);}if(game.x>W-R){game.x=W-R;game.vx=-Math.abs(game.vx);}if(game.y<R){game.y=R;game.vy=Math.abs(game.vy);}const overlap=game.x+R>=game.paddle&&game.x-R<=game.paddle+PW&&game.y+R>=game.py&&game.y-R<=game.py+38;if(overlap){game.score+=5;game.hits++;game.flash=.35;updateLabels();$('status').textContent='噴中了！加5分，下一隻出現了。';game.x=40+Math.random()*(W-80);game.y=R+2;const speed=Number($('speed').value),angle=(55+Math.random()*70)*Math.PI/180;game.vx=0;game.vy=speed;}if(game.flash>0)game.flash-=dt;if(game.y+R>=H){game.y=H-R;game.vy=-Math.abs(game.vy);}}
function draw(){
ctx.clearRect(0,0,W,H);ctx.strokeStyle='#a3b7a3';ctx.lineWidth=2;ctx.strokeRect(12,12,W-24,H-24);
const cx=game.paddle+PW/2,cy=game.py;
if(game.mode==='running'){
 // Decorative foam only: never used by step() or collision scoring.
 for(let i=0;i<48;i++){const f=((performance.now()/2200+i/48)%1),spread=Math.sin(i*9.73),bx=cx+spread*f*W*.92,by=cy+34-f*(H+100),r=18+f*58;
 ctx.fillStyle=`rgba(255,255,255,${.68*(1-f*.8)})`;ctx.strokeStyle=`rgba(113,164,158,${.58*(1-f)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${.9*(1-f)})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx-r*.12,by-r*.12,r*.65,3.4,4.8);ctx.stroke();}
 ctx.fillStyle='#365b48';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.setLineDash([4,4]);ctx.strokeStyle='#456e5c';ctx.strokeRect(game.paddle,cy,PW,38);ctx.setLineDash([]);ctx.fillText('有效噴霧區',cx,cy-8);
}
ctx.save();ctx.translate(cx,cy+33);ctx.scale(2,2);ctx.translate(-cx,-cy-33);ctx.fillStyle='#f5eedc';ctx.strokeStyle='#446652';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(cx-20,cy+50,40,48,8);ctx.fill();ctx.stroke();ctx.fillStyle='#759681';ctx.fillRect(cx-14,cy+38,28,13);ctx.fillStyle='#344d40';ctx.fillRect(cx-3,cy+33,15,7);ctx.fillStyle='#b74e3d';ctx.beginPath();ctx.arc(cx,cy+75,12,0,Math.PI*2);ctx.strokeStyle='#b74e3d';ctx.stroke();ctx.beginPath();ctx.moveTo(cx-8,cy+83);ctx.lineTo(cx+8,cy+67);ctx.stroke();
ctx.restore();ctx.save();ctx.translate(game.x,game.y);ctx.strokeStyle='#34433d';ctx.lineWidth=2;
for(let side of [-1,1]){ctx.fillStyle='#f4f7e8cc';ctx.beginPath();ctx.ellipse(side*12,-7,13,6,side*.5+Math.sin(performance.now()/55)*.12,0,Math.PI*2);ctx.fill();ctx.stroke();for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(side*5,j*5-3);ctx.lineTo(side*(14+j*2),j*7);ctx.lineTo(side*(18+j*2),j*7+7);ctx.stroke();}}
ctx.fillStyle='#606d62';ctx.beginPath();ctx.ellipse(0,5,6,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#34433d';ctx.beginPath();ctx.arc(0,-11,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(0,-26);ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-3,-13,2,0,7);ctx.arc(3,-13,2,0,7);ctx.fill();ctx.restore();
if(game.flash>0){ctx.fillStyle='#396550';ctx.textAlign='center';ctx.font='bold 30px sans-serif';ctx.fillText('噴中了！＋5',W/2,H/2);}
if(game.mode==='paused'){ctx.fillStyle='#f9f7eeda';ctx.fillRect(0,0,W,H);ctx.fillStyle='#294337';ctx.textAlign='center';ctx.font='bold 32px sans-serif';ctx.fillText('休息一下，隨時繼續',W/2,H/2);}}
function frame(t){const dt=Math.min((t-previous)/1000,.035);previous=t;step(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
$('end').onclick=finish;$('start').onclick=start;$('again').onclick=start;$('pause').onclick=pause;$('closeResult').onclick=()=>$('result').close();
$('speed').onchange=()=>{const v=Math.hypot(game.vx,game.vy);if(v){const s=Number($('speed').value);game.vx=game.vx/v*s;game.vy=game.vy/v*s;}};
canvas.onpointerdown=e=>{const b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;if(game.mode!=='running'&&game.mode!=='paused'&&Math.hypot(x-game.x,y-game.y)<35)start();dragging=true;canvas.setPointerCapture(e.pointerId);move(x,y);canvas.focus();};
canvas.onpointermove=e=>{if(dragging||e.pointerType==='mouse'){const b=canvas.getBoundingClientRect();move((e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height);draw();}};canvas.onpointerup=canvas.onpointercancel=()=>{dragging=false;};
for(const [id,dir] of [['left',-1],['right',1]]){const el=$(id);el.onpointerdown=e=>{e.preventDefault();held=dir;move(game.paddle+PW/2+dir*22);el.setPointerCapture(e.pointerId);};el.onpointerup=el.onpointercancel=()=>held=0;el.onclick=e=>{if(e.detail===0)move(game.paddle+PW/2+dir*35);};}
document.addEventListener('keydown',e=>{if($('result').open||e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();held=e.key==='ArrowLeft'?-1:1;move(game.paddle+PW/2+held*8);}if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();move(game.paddle+PW/2,game.py+PH/2+(e.key==='ArrowUp'?-16:16));}if(e.code==='Space'&&e.target===canvas){e.preventDefault();game.mode==='ready'||game.mode==='ended'?start():pause();}});
document.addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))held=0;});window.addEventListener('blur',()=>{held=0;dragging=false;if(game.mode==='running')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.mode==='running')pause();});
</script></body></html>
